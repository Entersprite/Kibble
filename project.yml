name: Kibble

options:
  bundleIdPrefix: com.entersprite
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

# One local package per library. The app links the domain, the store, the views,
# and both backends it can select at launch. GChatBridgeCore arrives only
# through LocalBridgeBackend, never directly - that containment is what lets a
# future iOS binary link RemoteBackend and contain no protocol code at all.
packages:
  ChatKit:
    path: Packages/ChatKit
  # The launch machine and the phase-to-scene mapping, so they are covered by
  # `scripts/test.sh` rather than living in a target nothing can test. Names no
  # backend - see the design doc §3.1.
  AppCore:
    path: Packages/AppCore
  SyncEngine:
    path: Packages/SyncEngine
  DesignSystem:
    path: Packages/DesignSystem
  FixtureBackend:
    path: Packages/FixtureBackend
  # The only package that links GChatBridgeCore. Present so the reverse-
  # engineered core is exercised in a real app target - the architecture's
  # spike 3 - and reachable at runtime by default; --backend=fixture switches
  # to the fixture instead.
  LocalBridgeBackend:
    path: Packages/LocalBridgeBackend
  # The macOS half of the shell: the LaunchServices conformance, cookie
  # capture, the probes. The package a future iOS app does not link.
  MacHost:
    path: Packages/MacHost

targets:
  KibbleMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/KibbleMac
    dependencies:
      - package: AppCore
        product: AppCore
      - package: DesignSystem
        product: DesignSystem
      - package: MacHost
        product: MacHost
    settings:
      base:
        # The identifier names the sandbox container (store, settings), the
        # notification permission and Sparkle's mach-lookup services. It moved
        # from com.entersprite.gchat in session 53; scripts/migrate-container.sh
        # carries an install's data across.
        PRODUCT_NAME: Kibble
        PRODUCT_BUNDLE_IDENTIFIER: com.entersprite.kibble
        INFOPLIST_FILE: Apps/KibbleMac/Info.plist
        # Apps/KibbleMac/AppIcon.icon, an Icon Composer document: Xcode compiles
        # its layers into the Liquid Glass icon and the pre-26 fallbacks, so
        # there is no asset catalog. Edit it in Icon Composer, never by hand.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/KibbleMac/KibbleMac.entitlements
        CODE_SIGN_IDENTITY: $(KIBBLE_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(KIBBLE_TEAM)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        # Xcode's debug dylib exists to serve SwiftUI Previews, which this
        # project never uses (no Xcode GUI). Turning it off removes
        # Kibble.debug.dylib and __preview.dylib. Sparkle.framework is now the
        # one library the app loads from its own bundle.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        # Hardened runtime enables library validation, which requires matching
        # Team IDs. A self-signed development certificate has no Team ID, so any
        # dylib the app loads from its own bundle is rejected and the process
        # dies at launch. Hardened runtime is only needed for notarized
        # distribution, where a real Developer ID supplies a Team ID. Release
        # loads Sparkle.framework, so KibbleMac.entitlements carries
        # disable-library-validation (measured, session 49).
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
          # Info.plist's KibbleUpdatesEnabled: only a Release build starts the
          # updater, so a development build never replaces itself.
          KIBBLE_UPDATES_ENABLED: "NO"
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Xcode otherwise adds get-task-allow, which lets any process attach a
          # debugger, to every build it signs. A published build must not carry
          # it, and scripts/package.sh refuses one that does.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          KIBBLE_UPDATES_ENABLED: "YES"

schemes:
  KibbleMac:
    build:
      targets:
        KibbleMac: all
    run:
      config: Debug
    archive:
      config: Release
