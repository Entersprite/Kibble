included:
  - Apps
  - Packages
  - Spikes

excluded:
  - .build
  - DerivedData
  - reference
  # 27k lines of machine-generated protobuf. It trips file_length and
  # type_body_length by construction, and reformatting it is meaningless
  # because generate-proto.sh overwrites it wholesale.
  - Packages/GChatBridgeCore/Sources/GChatBridgeCore/Generated

disabled_rules:
  - todo
  # Conflicts with swift-format's preference for trailing commas in
  # multi-line literals, which improves diffs.
  - trailing_comma

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 110
  error: 140
  ignores_comments: true

identifier_name:
  min_length: 2
  excluded: [id, to, up, ok]

type_body_length:
  warning: 300

file_length:
  warning: 400
