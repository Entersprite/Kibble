included:
  - Apps
  - Packages
  - Spikes

excluded:
  # Globbed, not bare: `included: Packages` sweeps in each package's own
  # .build/checkouts, which is vendored third-party source we neither own
  # nor should lint. A bare `.build` only matches the repo root.
  - "**/.build"
  - "**/DerivedData"
  - reference
  # 27k lines of machine-generated protobuf. It trips file_length and
  # type_body_length by construction, and reformatting it is meaningless
  # because generate-proto.sh overwrites it wholesale.
  - Packages/GChatBridgeCore/Sources/GChatBridgeCore/Generated

disabled_rules:
  - todo
  # Left to swiftformat, which owns comma style via `--commas inline`.
  # (The original comment here credited "swift-format" - Apple's tool, which
  # this repo never runs. Confusing the two is what caused the predecessor's
  # formatting incident; see scripts/fmt.sh.)
  - trailing_comma
  # Prefers the failable `String(bytes:encoding:)` over `String(decoding:as:)`.
  # Everything converted here is `JSONEncoder` output, which is valid UTF-8 by
  # construction, so the failable form would introduce an optional that cannot
  # be nil and an unwrap that cannot be exercised by a test.
  - optional_data_string_conversion

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 110
  error: 140
  ignores_comments: true

identifier_name:
  min_length: 2
  excluded: [id, to, up, ok]

# Every domain type in ChatKit nests an `ID`, and two characters is under
# type_name's default floor. Allowing the name once here rather than suppressing
# the rule at each declaration: the inline `disable:next` comments had to sit
# between a doc comment and its struct, which is exactly what
# `orphaned_doc_comment` reports.
type_name:
  excluded: [ID]

type_body_length:
  warning: 300

file_length:
  warning: 400
