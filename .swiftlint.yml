included:
  - Apps
  - Packages
  - Spikes

excluded:
  # Globbed, not bare: `included: Packages` sweeps in each package's own
  # .build/checkouts, which is vendored third-party source we neither own
  # nor should lint. A bare `.build` only matches the repo root.
  - "**/.build"
  - "**/DerivedData"
  - reference
  # 27k lines of machine-generated protobuf. It trips file_length and
  # type_body_length by construction, and reformatting it is meaningless
  # because generate-proto.sh overwrites it wholesale.
  - Packages/GChatBridgeCore/Sources/GChatBridgeCore/Generated

disabled_rules:
  - todo
  # Left to swiftformat, which owns comma style via `--commas inline`.
  # (The original comment here credited "swift-format" - Apple's tool, which
  # this repo never runs. Confusing the two is what caused the predecessor's
  # formatting incident; see scripts/fmt.sh.)
  - trailing_comma

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 110
  error: 140
  ignores_comments: true

identifier_name:
  min_length: 2
  excluded: [id, to, up, ok]

type_body_length:
  warning: 300

file_length:
  warning: 400
